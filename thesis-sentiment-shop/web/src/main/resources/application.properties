spring.application.name=thesis-sentiment-shop

spring.profiles.active=@runtime.spring.profile@@runtime.spring.evaluation.profile@

# --- Datasource ---
# MariaDB in Docker via docker-compose.yml at the project root.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

# --- Virtual threads ---
spring.threads.virtual.enabled=true

# --- Server ---
server.port=8080

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,beans

# --- Logging ---
logging.level.root=INFO
logging.level.com.thesis.sentimentshop=DEBUG

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=15673
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:guest}
spring.rabbitmq.publisher-confirm-type=correlated

# --- S-Async ---
sentiment.async.exchange=sentiment.exchange
sentiment.async.dlx=sentiment.dlx
sentiment.async.requests-queue=sentiment.requests
sentiment.async.requests-dlq=sentiment.requests.dlq
sentiment.async.results-queue=sentiment.results
sentiment.async.requests-routing-key=requests
sentiment.async.results-routing-key=results
sentiment.async.requests-dlq-routing-key=requests.dlq

# At-least-once delivery
sentiment.async.delivery-limit=3

# Publisher confirm timeout
sentiment.async.publish-confirm-timeout-ms=2000

# Listener container retry policy
sentiment.async.listener-concurrency=2
sentiment.async.listener-retry-attempts=3
sentiment.async.listener-retry-backoff-ms=500

# Pending-review sweeper
sentiment.async.pending-timeout-ms=30000
sentiment.async.sweeper-interval-ms=5000

# --- HuggingFace Inference API ---
sentiment.external.url=https://router.huggingface.co/hf-inference/models/cardiffnlp/twitter-roberta-base-sentiment-latest
sentiment.external.token=${HUGGINGFACE_API_TOKEN:}
sentiment.external.connect-timeout-ms=2000
sentiment.external.read-timeout-ms=10000

# --- X-Async ---
sentiment.external-async.exchange=sentiment.external.exchange
sentiment.external-async.dlx=sentiment.external.dlx
sentiment.external-async.requests-queue=sentiment.external.requests
sentiment.external-async.requests-routing-key=requests
sentiment.external-async.requests-dlq=sentiment.external.requests.dlq
sentiment.external-async.requests-dlq-routing-key=requests.dlq

sentiment.external-async.results-queue=sentiment.external.results
sentiment.external-async.results-routing-key=results

sentiment.external-async.delivery-limit=3
sentiment.external-async.listener-concurrency=2
sentiment.external-async.listener-retry-attempts=3
sentiment.external-async.listener-retry-backoff-ms=500
sentiment.external-async.publish-confirm-timeout-ms=2000