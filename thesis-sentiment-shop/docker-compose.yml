services:
  mariadb:
    image: mariadb:10.11
    env_file:
      - .env
    platform: linux/arm64/v8
    container_name: thesis-sentimentshop-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "13306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  inference-service:
    build:
      context: ../inference-service
    platform: linux/arm64/v8
    container_name: thesis-sentimentshop-inference
    restart: unless-stopped
    ports:
      - "18000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0 if r.status == 200 else 1)" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  rabbitmq:
    image: rabbitmq:4-management-alpine
    env_file:
      - .env
    platform: linux/arm64/v8
    container_name: thesis-sentimentshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15673:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  inference-service-consumer:
    build:
      context: ../inference-service
    platform: linux/arm64/v8
    container_name: thesis-sentimentshop-inference-consumer
    restart: unless-stopped
    command: ["python", "consumer.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      SENTIMENT_REQUESTS_QUEUE: sentiment.requests
      SENTIMENT_RESULTS_EXCHANGE: sentiment.exchange
      SENTIMENT_RESULTS_ROUTING_KEY: results
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mariadb_data:
  rabbitmq_data: